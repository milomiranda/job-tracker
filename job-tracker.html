<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Tracker</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--soft:#fafafa;--text:#111;--muted:#777;--bd:#e2e2e2;--ink:#111;--onink:#fff;--g1:#ececec;--f1:#555}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e0e0e;--card:#181818;--soft:#1f1f1f;--text:#f2f2f2;--muted:#8c8c8c;--bd:#2c2c2c;--ink:#f2f2f2;--onink:#111;--g1:#2a2a2a;--f1:#aaa}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e0e0e;--card:#181818;--soft:#1f1f1f;--text:#f2f2f2;--muted:#8c8c8c;--bd:#2c2c2c;--ink:#f2f2f2;--onink:#111;--g1:#2a2a2a;--f1:#aaa}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--text);font:14px/1.45 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:700}
button.pri{background:var(--ink);color:var(--onink);border-color:var(--ink)}
button.s{padding:2px 8px;font-size:11px;float:right;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--bd)}
.top h1{margin:0;font-size:18px;font-weight:900}.top div{display:flex;gap:8px}
.wrap{max-width:820px;margin:0 auto;padding:16px 20px 60px}
.side{position:fixed;left:20px;top:90px;width:320px;min-width:240px;max-width:90vw;max-height:calc(100vh - 110px);z-index:6;display:flex;flex-direction:column;overflow:hidden;resize:both;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 14px;cursor:grab;touch-action:none;user-select:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--bd)}
.sh button{padding:0 10px;line-height:22px;font-size:16px}
.sb{padding:12px 14px;overflow:auto;flex:1}.side.min .sb{display:none}.side.min{resize:none;height:auto!important}.side.min .sh{border-bottom:0}
@media(max-width:820px){.side{position:static;width:auto;max-width:none;max-height:320px;margin-bottom:12px;box-shadow:none;resize:none}.sh{cursor:default}}
.ac{margin-bottom:10px}.ac a{font-weight:900;font-size:13px;cursor:pointer;display:block;margin-bottom:3px}
.ln{display:flex;gap:6px}.ln button{padding:6px 10px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
#pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.pill{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--muted)}
.pill.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}.chk input{width:auto}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row:hover{background:var(--soft)}.row.fresh{border-left-color:#d0d0d0}.row.warm{border-left-color:#888}.row.stale{border-left-color:var(--ink)}
.rk{width:22px;color:var(--muted);font-size:12px;font-weight:700}.mid{flex:1;min-width:0}
.nm{font-weight:900;font-size:15px}.tx{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;margin:4px 6px 0 0}
.due{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--g1);color:var(--f1);margin-top:4px}.due.now{background:var(--ink);color:var(--onink)}
.days{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--g1);color:var(--f1);white-space:nowrap}
.stale .days{background:var(--ink);color:var(--onink)}.bd{font-size:11px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 14px;z-index:10}.ov[hidden]{display:none}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:620px}
.modal h2{margin:0 0 4px;font-size:20px;font-weight:900}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fld{margin-bottom:8px}
@media(max-width:520px){.g{grid-template-columns:1fr}}
label,.lb{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}
.blk{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:12px}.blk input{margin-bottom:6px}
.tg{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);font-weight:400;margin:8px 0}.tg input{width:auto}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.h{border-top:1px solid var(--bd);padding:9px 0;font-size:13px}.h b{font-size:11px;color:var(--muted);display:block;text-transform:uppercase}.h button{float:right;padding:2px 8px;font-size:11px}
</style>
</head>
<body>
<div class="top"><h1>Job Tracker</h1><div><span class="bd" id="sy" style="align-self:center"></span><button id="cfg" title="Connect Google Sheet">⚙ Connect sheet</button><button id="th" title="Theme">◐</button><button class="pri" id="add">+ New company</button></div></div>
<div class="wrap">
<aside class="side" id="side"><div class="sh" id="sh"><span>Next actions <span id="sc"></span></span><button id="mn" title="Minimize / restore">–</button></div><div class="sb" id="sb"></div></aside>
<main>
<input id="q" placeholder="Search companies, contacts…">
<div id="pills"></div>
<label class="chk" style="text-transform:none;letter-spacing:0;font-weight:400"><input type="checkbox" id="hide"> Hide inactive (60+ days)</label>
<div id="list"></div>
<div class="bd" style="margin-top:20px">Synced with your Google Sheet when connected; otherwise saved in this browser only.</div>
</main>
</div>
<div class="ov" id="ov" hidden></div>
<script>
const S=[["Lead enrichment","#e0e7ff","#3730a3"],["Ready for outreach","#cffafe","#155e75"],["Applied","#dbeafe","#1e40af"],["Waiting for response","#fef3c7","#92400e"],["Interview set / Prep","#fce7f3","#9d174d"],["Offer","#dcfce7","#166534"],["Not interested / Rejected","#e5e5e5","#555555"]];
const SN=S.map(s=>s[0]),CH=["Email","LinkedIn","WhatsApp","Call","In person","Job portal","Other"];
const CK=[["linkedin","LinkedIn URL (name fills in)"],["name","Name"],["role","Role / position"],["phone","Phone"],["email","E-mail"]];
const SK=["name","role","phone","email","linkedin"];
const $=s=>document.querySelector(s);
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const addD=(d,n)=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return iso(x)};
const fd=d=>new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const last=l=>l.log.slice().sort((a,b)=>b.d.localeCompare(a.d))[0];
const days=l=>{const t=last(l);return t?Math.max(0,Math.floor((new Date(today()+"T00:00:00")-new Date(t.d+"T00:00:00"))/864e5)):null};
const dues=l=>{const t=last(l),o=[];if(!t)return o;
 if(["Applied","Waiting for response"].includes(l.status))o.push(["Follow-up",addD(t.d,7)]);
 if(l.remind)o.push(["Monthly check-in",addD(t.d,30)]);return o.sort((a,b)=>a[1].localeCompare(b[1]))};
const isDue=l=>dues(l).some(x=>x[1]<=today());
const norm=l=>{if(!l.contacts)l.contacts=[l.c1,l.c2].filter(c=>c&&Object.values(c).some(Boolean));delete l.c1;delete l.c2;l.log=l.log||[];l.remind=!!l.remind;return l};
const blank=()=>({id:Date.now().toString(36),company:"",status:SN[0],action:"",website:"",remind:false,contacts:[],log:[]});
const slugName=u=>{try{const m=u.match(/linkedin\.com\/in\/([^/?#]+)/i);if(!m)return"";const p=decodeURIComponent(m[1]).split("-"),z=p[p.length-1];
 if(p.length>1&&/\d/.test(z)&&z.length>=5)p.pop();return p.map(w=>w?w[0].toUpperCase()+w.slice(1):"").join(" ")}catch(x){return""}};
let L=[],flt="all",CFG={},ok=false,tm;
try{L=JSON.parse(localStorage.getItem("jt1")||"[]").map(norm)}catch(x){}
try{CFG=JSON.parse(localStorage.getItem("jt_cfg")||"{}")}catch(x){}
const loc=()=>{try{localStorage.setItem("jt1",JSON.stringify(L))}catch(x){}};
const save=()=>{loc();push()};
const setSt=t=>{$("#sy").textContent=t};
const MON="jan feb mar apr may jun jul aug sep oct nov dec".split(" ");
async function api(action,data){const r=await fetch(CFG.url,{method:"POST",body:JSON.stringify({token:CFG.token,action,data})});const j=await r.json();if(j.error)throw new Error(j.error);return j}
const cRow=c=>SK.map(k=>(c&&c[k])||"");
const toRow=l=>{const g=l.log.slice().sort((a,b)=>b.d.localeCompare(a.d)),t=g[0];
 return [l.company,l.status,l.action,l.website,l.remind?"Yes":"",...cRow(l.contacts[0]),...cRow(l.contacts[1]),
 l.contacts.slice(2).map(c=>cRow(c).join(" | ")).join("\n"),
 g.map(x=>fd(x.d)+"/"+x.ch+"/Message: "+x.msg.replace(/ - /g," – ")).join(" - "),t?t.d:"",t?t.ch:""].map(v=>v??"")};
const toC=a=>{const c={};SK.forEach((k,i)=>c[k]=a[i]||"");return c};
const fromRow=(r,i)=>{const dt=r[17]||"",cs=[r.slice(5,10),r.slice(10,15)].filter(a=>a.some(Boolean)).map(toC);
 (r[15]||"").split("\n").filter(x=>x.trim()).forEach(x=>cs.push(toC(x.split(" | "))));
 const log=(r[16]||"").split(" - ").map(x=>x.trim()).filter(Boolean).map((x,k)=>{
  const m=x.match(/^(\d{1,2}) (\w+)\.? (\d{4})\/([^/]+)\/Message: ([\s\S]*)$/),mo=m?MON.indexOf(m[2].slice(0,3).toLowerCase()):-1;
  return mo>=0?{k:"s"+i+"_"+k,d:`${m[3]}-${String(mo+1).padStart(2,"0")}-${m[1].padStart(2,"0")}`,ch:m[4],msg:m[5]}:{k:"s"+i+"_"+k,d:dt||today(),ch:r[18]||"Other",msg:x}});
 return{id:"r"+i+Date.now().toString(36),company:r[0],status:r[1]||SN[0],action:r[2],website:r[3],remind:/^y/i.test(r[4]),contacts:cs,log}};
function push(){if(!CFG.url||!ok)return;clearTimeout(tm);setSt("Saving…");
 tm=setTimeout(async()=>{try{await api("replace",{rows:L.filter(l=>l.company).map(toRow)});setSt("Saved to sheet")}catch(x){setSt("Sync error")}},700)}
async function pull(){if(!CFG.url)return setSt("Local only");setSt("Loading…");
 try{const j=await api("list");L=j.rows.map(fromRow);ok=true;loc();render();setSt("Synced · "+L.length+" companies · script "+(j.v||"OLD VERSION")+(j.layout?" · "+j.layout+" layout · last row "+j.lastRow:""))}catch(x){setSt("Sync error – edits not sent")}}
function logDone(l){if(CFG.url&&ok)api("history",{rows:[[today(),l.company,l.action]]}).catch(()=>setSt("History not saved"))}
function setAction(l,v){v=v.trim();if(l.action&&v!==l.action)logDone(l);l.action=v}
const chip=s=>{const x=S.find(a=>a[0]==s)||S[0];return `<span class="chip" style="background:${x[1]};color:${x[2]}">${e(s)}</span>`};

function render(){
  const q=$("#q").value.toLowerCase(),hide=$("#hide").checked,cnt={},nd=L.filter(isDue).length;
  L.forEach(l=>cnt[l.status]=(cnt[l.status]||0)+1);
  $("#pills").innerHTML=`<button class="pill ${flt=="all"?"on":""}" data-s="all">All (${L.length})</button>`+(nd?`<button class="pill ${flt=="due"?"on":""}" data-s="due">⏰ Due (${nd})</button>`:"")+
   S.filter(s=>cnt[s[0]]).map(s=>`<button class="pill ${flt==s[0]?"on":""}" data-s="${e(s[0])}"><span class="dot" style="background:${s[2]}"></span>${e(s[0])} (${cnt[s[0]]})</button>`).join("");
  $("#pills").querySelectorAll("button").forEach(b=>b.onclick=()=>{flt=b.dataset.s;render()});
  const v=L.filter(l=>(flt=="all"||(flt=="due"?isDue(l):l.status==flt))&&(!hide||(days(l)??0)<60)&&(!q||JSON.stringify([l.company,l.action,l.contacts]).toLowerCase().includes(q)))
    .sort((a,b)=>(last(b)?.d||"").localeCompare(last(a)?.d||""));
  $("#list").innerHTML=v.length?v.map((l,i)=>{const t=last(l),n=days(l),u=n==null?"":n>=21?"stale":n>=8?"warm":"fresh",x=dues(l)[0],now=x&&x[1]<=today();
    return `<div class="row ${u}" data-id="${l.id}"><div class="rk">${i+1}</div><div class="mid"><div class="nm">${e(l.company||"(no name)")}</div>${chip(l.status)}${x?`<span class="due ${now?"now":""}">${now?"⏰ "+x[0]+" due":"↻ "+x[0]+" "+fd(x[1])}</span>`:""}<div class="tx">${t?e(fd(t.d)+" · "+t.ch+" · "+t.msg):"No touchpoint logged"}</div></div><div style="text-align:right"><div class="days">${n==null?"–":n+(n==1?" day":" days")}</div>${l.log.length?`<div class="bd" style="margin-top:4px">💬 ${l.log.length}</div>`:""}</div></div>`}).join(""):`<div class="empty">${L.length?"No matches.":"No companies yet. Click “+ New company” to add your first one."}</div>`;
  $("#list").querySelectorAll(".row").forEach(r=>r.onclick=()=>detail(r.dataset.id));
  side();
}
function side(){
  const v=L.filter(l=>l.company).sort((a,b)=>(!!b.action)-(!!a.action)||a.company.localeCompare(b.company));
  $("#sc").textContent="("+v.filter(l=>l.action).length+")";$("#sb").innerHTML=(v.length?v.map(l=>`<div class="ac"><a data-o="${l.id}">${e(l.company)}</a><div class="ln"><textarea data-a="${l.id}" rows="2" placeholder="Add next step…" style="resize:none">${e(l.action)}</textarea><button data-d="${l.id}" title="Mark done" ${l.action?"":"hidden"}>✓</button></div></div>`).join(""):'<div class="bd">Add a company to start.</div>');
  const s=$("#sb");s.querySelectorAll("[data-a]").forEach(i=>i.onkeydown=ev=>{if(ev.key=="Enter"){ev.preventDefault();i.blur()}});
  s.querySelectorAll("[data-o]").forEach(a=>a.onclick=()=>detail(a.dataset.o));
  s.querySelectorAll("[data-a]").forEach(i=>i.onchange=()=>{setAction(L.find(x=>x.id==i.dataset.a),i.value);save();render()});
  s.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const l=L.find(x=>x.id==b.dataset.d);logDone(l);l.action="";save();render()});
}
const open=h=>{$("#ov").innerHTML=`<div class="modal">${h}</div>`;$("#ov").hidden=false};
const close=()=>{$("#ov").hidden=true;render()};
$("#ov").onclick=ev=>{if(ev.target.id=="ov")close()};
const sel=(id,arr,v)=>`<select id="${id}">${arr.map(o=>`<option ${o==v?"selected":""}>${e(o)}</option>`).join("")}</select>`;
const cb=(i,c)=>`<div class="blk"><div class="lb">Contact ${i+1}<button class="s" data-r="${i}">Remove</button></div>${CK.map(([f,p])=>`<input data-p="contacts.${i}.${f}" placeholder="${p}" value="${e(c[f])}">`).join("")}</div>`;

function detail(id){
  const l=L.find(x=>x.id==id);if(!l)return;
  open(`<div class="fld"><label>Company</label><input data-p="company" value="${e(l.company)}"></div>
  <div class="g"><div class="fld"><label>Status</label>${sel("st",SN,l.status)}</div><div class="fld"><label>Website</label><div class="ln"><input data-p="website" value="${e(l.website)}"><button data-o="website">↗</button></div></div></div>
  <div class="fld"><label>Action (next step)</label><input data-p="action" value="${e(l.action)}"></div>
  <label class="tg"><input type="checkbox" id="rm" ${l.remind?"checked":""}> Remind me to contact them again 1 month after the last touchpoint</label>
  <div class="lb" style="margin-top:12px">Contacts</div>
  <div class="g">${l.contacts.map((c,i)=>cb(i,c)).join("")}</div>
  <button id="ac" style="margin-top:8px">+ Add contact</button>
  <div class="act" style="justify-content:stretch"><button class="pri" style="flex:1" id="lg">+ Log touchpoint</button><button id="dl" style="color:var(--muted)">Delete</button></div>
  <div style="margin-top:16px"><div class="lb">History (${l.log.length})</div>${l.log.length?l.log.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(t=>`<div class="h"><button data-x="${t.k}">Delete</button><b>${e(fd(t.d))} · ${e(t.ch)}</b>${e(t.msg)}</div>`).join(""):'<div class="bd">No history yet.</div>'}</div>
  <div class="act"><button id="cl">Close</button></div>`);
  const m=$(".modal");
  m.querySelectorAll("[data-p]").forEach(i=>i.onchange=()=>{const p=i.dataset.p.split(".");
   if(p[0]=="contacts"){const c=l.contacts[p[1]];c[p[2]]=i.value;
    if(p[2]=="linkedin"&&!c.name){const n=slugName(i.value);if(n){c.name=n;save();return detail(id)}}}
   else if(p[0]=="action")setAction(l,i.value);else l[p[0]]=i.value;
   save()});
  $("#st").onchange=ev=>{l.status=ev.target.value;save()};
  $("#rm").onchange=ev=>{l.remind=ev.target.checked;save()};
  $("#ac").onclick=()=>{l.contacts.push({});save();detail(id)};
  m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(confirm("Remove this contact?")){l.contacts.splice(+b.dataset.r,1);save();detail(id)}});
  m.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const u=l[b.dataset.o];if(u)window.open(/^https?:/.test(u)?u:"https://"+u,"_blank","noopener")});
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("Delete this touchpoint?")){l.log=l.log.filter(t=>t.k!=b.dataset.x);save();detail(id)}});
  $("#lg").onclick=()=>logf(id);$("#cl").onclick=close;
  $("#dl").onclick=()=>{if(confirm("Delete this company?")){L=L.filter(x=>x.id!=id);save();close()}};
}
function logf(id){
  open(`<h2>Log touchpoint</h2><div class="fld"><label>Date</label><input type="date" id="td" value="${today()}"></div><div class="fld"><label>Channel</label>${sel("tc",CH,CH[0])}</div><div class="fld"><label>Message</label><textarea id="tm" rows="4" placeholder="What was discussed…"></textarea></div><div class="act"><button id="cn">Cancel</button><button class="pri" id="sv">Save</button></div>`);
  $("#cn").onclick=()=>detail(id);
  $("#sv").onclick=()=>{if(!$("#td").value)return alert("Enter a date");const l=L.find(x=>x.id==id);l.log.push({k:Date.now().toString(36),d:$("#td").value,ch:$("#tc").value,msg:$("#tm").value.trim()});save();detail(id)};
}
function form(){
  open(`<h2>New company</h2><div class="fld"><label>Company</label><input id="f_c"></div>
  <div class="g"><div class="fld"><label>Status</label>${sel("f_s",SN,SN[0])}</div><div class="fld"><label>Website</label><input id="f_w"></div></div>
  <div class="fld"><label>Action (next step)</label><input id="f_a"></div>
  <label class="tg"><input type="checkbox" id="f_r"> Monthly reminder</label>
  <div class="bd">You can add contacts on the next screen.</div>
  <div class="act"><button id="cn">Cancel</button><button class="pri" id="sv">Save</button></div>`);
  $("#cn").onclick=close;
  $("#sv").onclick=()=>{const c=$("#f_c").value.trim();if(!c)return alert("Enter a company name");
   const l=blank();Object.assign(l,{company:c,status:$("#f_s").value,website:$("#f_w").value,action:$("#f_a").value.trim(),remind:$("#f_r").checked});
   L.push(l);save();detail(l.id)};
}
$("#add").onclick=form;
$("#cfg").onclick=()=>{const u=prompt("Apps Script web app URL",CFG.url||"");if(u===null)return;const t=prompt("Token",CFG.token||"");if(t===null)return;
 CFG={url:u.trim(),token:t.trim()};try{localStorage.setItem("jt_cfg",JSON.stringify(CFG))}catch(x){}pull()};
$("#q").oninput=render;$("#hide").onchange=render;
$("#th").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes("dark");r.dataset.theme=d?"light":"dark"};
const W=$("#side"),WH=$("#sh");let pos={x:20,y:90,min:false},dr=null;
try{Object.assign(pos,JSON.parse(localStorage.getItem("jt_win")||"{}"))}catch(x){}
const place=()=>{const mob=innerWidth<=820;W.style.left=mob?"":Math.min(Math.max(0,pos.x),innerWidth-120)+"px";W.style.top=mob?"":Math.min(Math.max(60,pos.y),innerHeight-50)+"px";W.classList.toggle("min",pos.min);$("#mn").textContent=pos.min?"+":"–"};
const sw=()=>{try{localStorage.setItem("jt_win",JSON.stringify(pos))}catch(x){}};
$("#mn").onclick=()=>{pos.min=!pos.min;place();sw()};
WH.onpointerdown=ev=>{if(ev.target.closest("button")||innerWidth<=820)return;dr={x:ev.clientX-W.offsetLeft,y:ev.clientY-W.offsetTop};WH.setPointerCapture(ev.pointerId);WH.style.cursor="grabbing"};
WH.onpointermove=ev=>{if(!dr)return;pos.x=ev.clientX-dr.x;pos.y=ev.clientY-dr.y;place()};
WH.onpointerup=()=>{if(dr){dr=null;WH.style.cursor="";sw()}};
WH.ondblclick=ev=>{if(!ev.target.closest("button")){pos.min=!pos.min;place();sw()}};
addEventListener("resize",place);place();
render();pull();
</script>
</body>
</html>
